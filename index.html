<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%232f6fed%22/%3E%3Crect%20x=%2214%22%20y=%2216%22%20width=%2230%22%20height=%225%22%20rx=%222.5%22%20fill=%22%23fff%22/%3E%3Crect%20x=%2214%22%20y=%2229%22%20width=%2236%22%20height=%225%22%20rx=%222.5%22%20fill=%22%23fff%22%20opacity=%22.75%22/%3E%3Crect%20x=%2214%22%20y=%2242%22%20width=%2216%22%20height=%226%22%20rx=%221%22%20fill=%22%23fff%22/%3E%3Crect%20x=%2234%22%20y=%2240%22%20width=%2210%22%20height=%2210%22%20rx=%221%22%20fill=%22%23fff%22%20opacity=%22.95%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  :root {
    --bg: #fbfbf8; --bg2: #f1f1ec; --fg: #222; --muted: #888; --border: #ddddd5;
    --accent: #2f6fed; --code: #ececE6; --sel: #cfe0ff;
    --h: #a1260d; --em: #5b3fa0; --link: #1a6fb0; --quote: #6b7d56;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161718; --bg2: #1e2022; --fg: #d8d8d4; --muted: #787b80; --border: #2c2f32;
      --accent: #6a9dff; --code: #25282b; --sel: #2c4a7c;
      --h: #e58a74; --em: #b6a0f0; --link: #6cb6f0; --quote: #9db387;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161718; --bg2: #1e2022; --fg: #d8d8d4; --muted: #787b80; --border: #2c2f32;
    --accent: #6a9dff; --code: #25282b; --sel: #2c4a7c;
    --h: #e58a74; --em: #b6a0f0; --link: #6cb6f0; --quote: #9db387;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex; overflow: hidden;
  }
  button {
    font: inherit; color: var(--fg); background: none; border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 8px; cursor: pointer;
  }
  button:hover { background: var(--bg2); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* sidebar */
  #sidebar {
    width: 220px; flex: none; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  #sidebar header { display: flex; gap: 6px; padding: 8px; align-items: center; }
  #sidebar header strong { flex: 1; }
  #list { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
  #list li {
    display: flex; align-items: center; gap: 4px; padding: 5px 8px; cursor: pointer;
    border-left: 3px solid transparent;
  }
  #list li:hover { background: var(--bg); }
  #list li.active { background: var(--bg); border-left-color: var(--accent); }
  #list .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .acts { display: none; gap: 2px; }
  #list li:hover .acts, #list li.active .acts { display: flex; }
  #list .acts button { padding: 0 5px; border: none; color: var(--muted); }
  #list .acts button:hover { color: var(--fg); }
  #list li.arm .acts { display: flex; }
  #list .acts button.armed { color: #d33; font-weight: bold; }
  #sidebar footer { padding: 8px; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }
  body.no-sidebar #sidebar { display: none; }

  /* main */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #bar {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }
  #bar .title {
    flex: 1; min-width: 0; font: inherit; color: var(--muted); background: none;
    border: 1px solid transparent; border-radius: 4px; padding: 2px 6px; text-overflow: ellipsis;
  }
  #bar .title:hover { border-color: var(--border); }
  #bar .title:focus { outline: none; color: var(--fg); border-color: var(--accent); background: var(--bg); }
  #panes { flex: 1; min-height: 0; display: flex; }
  #editor { flex: 1; min-width: 0; min-height: 0; overflow: hidden; }
  #editor .cm-editor { height: 100%; }
  #preview {
    flex: 1; min-width: 0; overflow-y: auto; padding: 16px 28px; display: none;
    border-left: 1px solid var(--border);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.65;
  }
  body.preview-on #preview { display: block; }
  #preview h1, #preview h2, #preview h3 { line-height: 1.25; }
  #preview a { color: var(--link); }
  #preview code { background: var(--code); padding: 1px 4px; border-radius: 3px; font-family: ui-monospace, Menlo, monospace; font-size: .9em; }
  #preview pre { background: var(--code); padding: 10px 12px; border-radius: 4px; overflow-x: auto; }
  #preview pre code { padding: 0; background: none; }
  #preview blockquote { margin-left: 0; padding-left: 14px; border-left: 3px solid var(--border); color: var(--muted); }
  #preview table { border-collapse: collapse; }
  #preview th, #preview td { border: 1px solid var(--border); padding: 4px 10px; }
  #preview img { max-width: 100%; }
  #preview .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  #preview .math-err { color: #d33; }
  #status {
    display: flex; gap: 14px; padding: 2px 10px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 12px;
  }
  #status #mode { color: var(--fg); font-weight: bold; min-width: 12ch; }
  #status .sp { flex: 1; }
  #status button { padding: 0 6px; font-size: 12px; color: var(--muted); }

  /* CodeMirror */
  .cm-editor { background: var(--bg); color: var(--fg); font-size: 14px; }
  .cm-editor.cm-focused { outline: none; }
  .cm-scroller { font-family: inherit; line-height: 1.6; padding: 8px 0; }
  .cm-content { padding: 0 20px; caret-color: var(--fg); }
  .cm-editor .cm-cursor, .cm-editor .cm-dropCursor { border-left: 2px solid var(--fg); }
  .cm-fat-cursor { background: var(--accent) !important; color: var(--bg) !important; }
  .cm-editor:not(.cm-focused) .cm-fat-cursor { background: none !important; outline: 1px solid var(--accent); }
  .cm-selectionBackground, .cm-editor.cm-focused .cm-selectionBackground { background: var(--sel) !important; }
  .cm-activeLine { background: transparent; }
  .cm-panels { background: var(--bg2); color: var(--fg); border-color: var(--border); font-family: inherit; }
  .cm-panels input { background: transparent; color: var(--fg); border: none; outline: none; font: inherit; }

  #toast { position: fixed; bottom: 36px; right: 14px; background: var(--fg); color: var(--bg); padding: 6px 12px; border-radius: 4px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: .92; }
  #linkbox { position: fixed; bottom: 64px; right: 14px; width: min(420px, calc(100vw - 28px)); font: inherit; padding: 6px 8px; color: var(--fg); background: var(--bg2); border: 1px solid var(--accent); border-radius: 4px; }

  @media (max-width: 800px) {
    #sidebar { position: fixed; z-index: 10; top: 0; bottom: 0; left: 0; box-shadow: 2px 0 10px rgba(0,0,0,.25); }
    body.no-sidebar #sidebar { display: none; }
    body:not(.no-sidebar) #sidebar { display: flex; }
    #menu-btn { display: inline-block; }
    body.preview-on #editor { display: none; }
    #preview { border-left: none; padding: 14px 16px; }
    #bar .hide-narrow { display: none; }
  }
</style>
</head>
<body class="preview-on">
<aside id="sidebar">
  <header><strong>Notes</strong><button id="new" title="New note (Alt+N)">+ new</button></header>
  <ul id="list"></ul>
  <footer>
    <button id="import" title="Import a .md file">import</button>
    <button id="theme" title="Toggle theme">theme</button>
    <input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
  </footer>
</aside>
<div id="main">
  <div id="bar">
    <button id="menu-btn" title="Show/hide sidebar (Alt+B)">☰</button>
    <input class="title" id="title" type="text" spellcheck="false" aria-label="Note name" title="Click to rename">
    <button id="toggle" title="Toggle preview (Alt+P)">preview</button>
    <button id="export" title="Download as .md">export .md</button>
    <button id="share" title="Copy a link containing this note">copy link</button>
  </div>
  <div id="panes">
    <div id="editor"></div>
    <div id="preview"></div>
  </div>
  <div id="status">
    <span id="mode">-- NORMAL --</span>
    <button id="vim" class="linkish">vim: on</button>
    <span id="saved"></span>
    <span class="sp"></span>
    <span id="count"></span>
    <span class="hide-narrow">Alt+N new · Alt+P preview · Alt+B sidebar · Alt+V vim · :w save</span>
  </div>
</div>
<input id="linkbox" type="text" readonly hidden aria-label="Share link">
<div id="toast" role="status"></div>

<script type="importmap">
{ "imports": {
  "@codemirror/state": "https://esm.sh/@codemirror/state@6.7.6",
  "@lezer/common": "https://esm.sh/@lezer/common@1.5.3",
  "@lezer/lr": "https://esm.sh/@lezer/lr@1.4.2?external=@lezer/common",
  "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.5?external=@lezer/common",
  "@codemirror/view": "https://esm.sh/@codemirror/view@6.43.14?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr",
  "@codemirror/language": "https://esm.sh/@codemirror/language@6.13.1?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr",
  "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.11.1?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr",
  "@codemirror/search": "https://esm.sh/@codemirror/search@6.7.2?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr",
  "@codemirror/lang-markdown": "https://esm.sh/@codemirror/lang-markdown@6.5.2?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr",
  "@replit/codemirror-vim": "https://esm.sh/@replit/codemirror-vim@6.4.0?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr",
  "markdown-it": "https://esm.sh/markdown-it@14.1.0",
  "katex": "https://esm.sh/katex@0.16.11",
  "lz-string": "https://esm.sh/lz-string@1.5.0"
} }
</script>
<script type="module">
const [{ EditorState, Compartment }, { EditorView, keymap, drawSelection }, { defaultKeymap, history, historyKeymap },
       { markdown }, { HighlightStyle, syntaxHighlighting }, { tags: t }, { vim, Vim, getCM },
       { default: MarkdownIt }, { default: katex }, { default: LZ }] = await Promise.all([
  import("@codemirror/state"),
  import("@codemirror/view"),
  import("@codemirror/commands"),
  import("@codemirror/lang-markdown"),
  import("@codemirror/language"),
  import("@lezer/highlight"),
  import("@replit/codemirror-vim"),
  import("markdown-it"),
  import("katex"),
  import("lz-string"),
]);

const $ = (id) => document.getElementById(id);

/* ---------- storage (every access guarded) ---------- */
const KEY = "notes.v1", THEME_KEY = "notes.theme", SIDEBAR_KEY = "notes.sidebar";
const mem = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { mem[k] = v; return false; } },
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let state = { notes: [], current: null };
try { const s = JSON.parse(store.get(KEY)); if (s && Array.isArray(s.notes)) state = s; } catch {}
const cur = () => state.notes.find((n) => n.id === state.current);
function persist() {
  const ok = store.set(KEY, JSON.stringify(state));
  $("saved").textContent = ok ? "saved" : "not saved (storage unavailable)";
}
let saveTimer;
function scheduleSave() { $("saved").textContent = "…"; clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400); }
function flushSave() { clearTimeout(saveTimer); persist(); }
function addNote(title, content = "") {
  const n = { id: uid(), title: title || "Untitled", auto: !title, content, updated: Date.now() };
  state.notes.unshift(n); state.current = n.id; return n;
}
if (!state.notes.length) addNote("", "# Welcome\n\nInline math $e^{i\\pi}+1=0$ and display math:\n\n$$\\int_0^\\infty e^{-x^2}\\,dx=\\frac{\\sqrt{\\pi}}{2}$$\n\nVim keys work: `i`, `Esc`, `dd`, `:w`.\n");
if (!cur()) state.current = state.notes[0].id;

/* ---------- markdown + math ---------- */
const md = new MarkdownIt({ html: false, linkify: true, breaks: false });
// Pull math out before markdown sees it (skipping code), then splice KaTeX HTML back in.
const TOKEN = /(```[\s\S]*?(?:```|$)|~~~[\s\S]*?(?:~~~|$)|`[^`\n]*`)|\\\$|\$\$([\s\S]+?)\$\$|\$(?!\s)((?:\\.|[^$\\\n])+?)(?<!\s)\$(?!\d)/g;
function render(src) {
  const math = [];
  const safe = src.replace(TOKEN, (m, code, disp, inl) => {
    if (code || m === "\\$") return m;
    math.push({ tex: (disp ?? inl).trim(), display: disp != null });
    return `@@MATH${math.length - 1}@@`;
  });
  return md.render(safe).replace(/@@MATH(\d+)@@/g, (_, i) => {
    const { tex, display } = math[+i];
    try { return katex.renderToString(tex, { displayMode: display, throwOnError: true, trust: false }); }
    catch (e) { return `<span class="math-err" title="${md.utils.escapeHtml(e.message)}">${md.utils.escapeHtml(display ? `$$${tex}$$` : `$${tex}$`)}</span>`; }
  });
}
let rafId;
function updatePreview() {
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(() => { $("preview").innerHTML = render(view.state.doc.toString()); });
}

/* ---------- editor ---------- */
const hl = HighlightStyle.define([
  { tag: [t.heading, t.heading1, t.heading2, t.heading3], color: "var(--h)", fontWeight: "bold" },
  { tag: t.emphasis, color: "var(--em)", fontStyle: "italic" },
  { tag: t.strong, color: "var(--em)", fontWeight: "bold" },
  { tag: t.link, color: "var(--link)" }, { tag: t.url, color: "var(--link)" },
  { tag: t.quote, color: "var(--quote)" },
  { tag: [t.monospace, t.processingInstruction, t.meta], color: "var(--muted)" },
]);
let applying = false;
const VIM_KEY = "notes.vim";
const vimConf = new Compartment();
let vimOn = store.get(VIM_KEY) !== "off";
const view = new EditorView({
  parent: $("editor"),
  state: EditorState.create({
    doc: cur().content,
    extensions: [
      vimConf.of(vimOn ? vim() : []),
      history(), drawSelection(),
      keymap.of([...defaultKeymap, ...historyKeymap]),
      markdown(), syntaxHighlighting(hl),
      EditorView.lineWrapping,
      EditorView.updateListener.of((u) => {
        if (!u.docChanged || applying) return;
        const n = cur(); n.content = u.state.doc.toString(); n.updated = Date.now();
        if (n.auto) { n.title = autoTitle(n.content); renderList(); }
        updatePreview(); updateCount(); scheduleSave();
      }),
    ],
  }),
});
const autoTitle = (c) => (c.split("\n").map((l) => l.replace(/^[#>\-*\s]+/, "").trim()).find(Boolean) || "Untitled").slice(0, 60);
function updateCount() {
  const s = view.state.doc.toString().trim();
  $("count").textContent = (s ? s.split(/\s+/).length : 0) + " words";
}

// Vim: :w saves, mode indicator
Vim.defineEx("write", "w", () => { flushSave(); toast("saved"); });
Vim.defineEx("wq", "wq", () => { flushSave(); toast("saved"); });
function bindVim() {
  const cm = getCM(view);
  if (!cm) return;
  cm.on("vim-mode-change", (e) => {
    const sub = e.subMode ? ({ linewise: "V-LINE", blockwise: "V-BLOCK" })[e.subMode] : null;
    const name = e.mode === "visual" ? sub || "VISUAL" : e.mode.toUpperCase();
    $("mode").textContent = `-- ${name} --`;
  });
}
function setVim(on) {
  vimOn = on;
  view.dispatch({ effects: vimConf.reconfigure(on ? vim() : []) });
  store.set(VIM_KEY, on ? "on" : "off");
  $("vim").textContent = on ? "vim: on" : "vim: off";
  $("vim").title = "Turn Vim keybindings " + (on ? "off" : "on") + " (Alt+V)";
  $("mode").textContent = on ? "-- NORMAL --" : "";
  if (on) bindVim();
  view.focus();
}

/* ---------- note list ---------- */
let pendingDelete = null, pendingTimer;
function armDelete(id) {
  pendingDelete = id; renderList();
  clearTimeout(pendingTimer); pendingTimer = setTimeout(disarmDelete, 3000);
}
function disarmDelete() {
  if (pendingDelete === null) return;
  clearTimeout(pendingTimer); pendingDelete = null; renderList();
}
// dismiss the "delete?" prompt: click anywhere else, move the mouse off the row, or press Esc
document.addEventListener("click", (e) => { if (!e.target.closest("[data-a=delete].armed")) disarmDelete(); }, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") disarmDelete(); }, true);
document.addEventListener("mousemove", (e) => {
  if (pendingDelete !== null && !e.target.closest("li.arm")) disarmDelete();
});
function renderList() {
  const ul = $("list"); ul.textContent = "";
  for (const n of state.notes) {
    const li = document.createElement("li");
    li.className = n.id === state.current ? "active" : "";
    li.dataset.id = n.id;
    const arm = pendingDelete === n.id;
    li.innerHTML = `<span class="t"></span><span class="acts"><button data-a="rename" title="Rename">✎</button><button data-a="delete" class="${arm ? "armed" : ""}" title="${arm ? "Click again to delete" : "Delete"}">${arm ? "delete?" : "✕"}</button></span>`;
    if (arm) li.classList.add("arm");
    li.querySelector(".t").textContent = n.title;
    ul.append(li);
  }
  $("title").value = cur()?.title ?? "";
  document.title = (cur()?.title || "Notes") + " — Notes";
}
function switchTo(id) {
  flushSave();
  state.current = id;
  applying = true;
  view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: cur().content }, selection: { anchor: 0 } });
  applying = false;
  persist(); renderList(); updatePreview(); updateCount();
  if (innerWidth <= 800) document.body.classList.add("no-sidebar");
  view.focus();
}
function newNote(title, content) { flushSave(); const n = addNote(title, content); persist(); switchTo(n.id); }
$("list").addEventListener("click", (e) => {
  const li = e.target.closest("li"); if (!li) return;
  const id = li.dataset.id, a = e.target.dataset.a;
  if (a === "rename") {
    if (id !== state.current) switchTo(id);
    if (innerWidth <= 800) document.body.classList.remove("no-sidebar");
    $("title").focus(); $("title").select();
  } else if (a === "delete") {
    const n = state.notes.find((x) => x.id === id);
    if (pendingDelete !== id) { armDelete(id); return; }
    clearTimeout(pendingTimer); pendingDelete = null;
    state.notes = state.notes.filter((x) => x.id !== id);
    if (!state.notes.length) addNote("", "");
    if (state.current === id || !cur()) state.current = state.notes[0].id;
    persist(); switchTo(state.current);
  } else if (id !== state.current) switchTo(id);
});
$("new").onclick = () => newNote();

// inline rename: edit the note name in the top bar
const titleEl = $("title");
titleEl.addEventListener("input", () => {
  const n = cur(); n.title = titleEl.value; n.auto = false;
  const t = $("list").querySelector("li.active .t"); if (t) t.textContent = n.title || "Untitled";
  scheduleSave();
});
titleEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === "Escape") { e.preventDefault(); titleEl.blur(); view.focus(); }
});
titleEl.addEventListener("blur", () => {
  const n = cur();
  if (!n.title.trim()) { n.auto = true; n.title = autoTitle(n.content); }
  else n.title = n.title.trim();
  renderList(); flushSave();
});

/* ---------- export / import / share ---------- */
function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800);
}
$("export").onclick = () => {
  const n = cur();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([n.content], { type: "text/markdown" }));
  a.download = (n.title.replace(/[\\/:*?"<>|]+/g, "_").trim() || "note") + ".md";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("import").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  for (const f of e.target.files) {
    const text = await f.text();
    newNote(f.name.replace(/\.(md|markdown|txt)$/i, ""), text);
  }
  e.target.value = "";
};
$("share").onclick = async () => {
  const n = cur();
  const url = location.href.split("#")[0] + "#n=" + LZ.compressToEncodedURIComponent(JSON.stringify({ t: n.title, c: n.content }));
  try { await navigator.clipboard.writeText(url); toast(`link copied (${url.length} chars)`); }
  catch { showLink(url); }
};
function showLink(url) {
  const box = $("linkbox"); box.value = url; box.hidden = false; box.focus(); box.select();
  toast("press Ctrl/Cmd+C to copy the link");
}
$("linkbox").addEventListener("blur", () => { $("linkbox").hidden = true; });
$("linkbox").addEventListener("keydown", (e) => { if (e.key === "Escape") $("linkbox").blur(); });
function loadFromHash() {
  const m = location.hash.match(/^#n=(.+)$/); if (!m) return;
  try {
    const d = JSON.parse(LZ.decompressFromEncodedURIComponent(m[1]));
    if (typeof d.c !== "string") throw 0;
    history.replaceState(null, "", location.pathname + location.search);
    newNote(String(d.t || "Shared note"), d.c);
    toast("opened shared note as a new note");
  } catch { toast("invalid share link"); }
}

/* ---------- theme, layout, shortcuts ---------- */
const root = document.documentElement;
const sysDark = () => matchMedia("(prefers-color-scheme: dark)").matches;
const effTheme = () => root.dataset.theme || (sysDark() ? "dark" : "light");
{ const s = store.get(THEME_KEY); if (s === "light" || s === "dark") root.dataset.theme = s; }
$("theme").onclick = () => { const n = effTheme() === "dark" ? "light" : "dark"; root.dataset.theme = n; store.set(THEME_KEY, n); };

function setPreview(on) { document.body.classList.toggle("preview-on", on); if (on) updatePreview(); }
$("toggle").onclick = () => setPreview(!document.body.classList.contains("preview-on"));
function toggleSidebar() {
  const hidden = document.body.classList.toggle("no-sidebar");
  if (innerWidth > 800) store.set(SIDEBAR_KEY, hidden ? "hidden" : "shown");
}
$("menu-btn").onclick = toggleSidebar;
if (innerWidth > 800 && store.get(SIDEBAR_KEY) === "hidden") document.body.classList.add("no-sidebar");
if (innerWidth <= 800) { document.body.classList.add("no-sidebar"); setPreview(false); }

addEventListener("keydown", (e) => {
  if (!e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.code === "KeyN") { e.preventDefault(); newNote(); }
  else if (e.code === "KeyP") { e.preventDefault(); $("toggle").click(); }
  else if (e.code === "KeyB") { e.preventDefault(); toggleSidebar(); }
  else if (e.code === "KeyV") { e.preventDefault(); setVim(!vimOn); }
}, true);
addEventListener("beforeunload", flushSave);
addEventListener("hashchange", loadFromHash);

$("vim").onclick = () => setVim(!vimOn);
bindVim();
if (!vimOn) { $("vim").textContent = "vim: off"; $("vim").title = "Turn Vim keybindings on (Alt+V)"; $("mode").textContent = ""; }
renderList(); updatePreview(); updateCount();
$("saved").textContent = "";
loadFromHash();
view.focus();
window.__notes = { view, state: () => state, Vim };
</script>
</body>
